<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A desktop webview: no zooming, no telephone autodetection, and a CSP
         that permits exactly nothing remote. §12 promises the app makes no
         network calls except to Telegram — and those happen in Rust, never
         here — so the webview is locked down to its own bundle. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: asset: http://asset.localhost; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost"
    />
    <title>TeleWire</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
